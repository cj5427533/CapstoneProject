name: CD

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./my-react-app/backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Validate Docker secrets
        id: validate
        run: |
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "::error::DOCKER_USERNAME secret is not set. Please configure it in repository settings."
            exit 1
          fi
          if [ -z "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "::error::DOCKER_PASSWORD secret is not set. Please configure it in repository settings."
            exit 1
          fi
          echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> $GITHUB_ENV
          echo "IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/capstone-backend" >> $GITHUB_ENV
          echo "Docker secrets validated"
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Debug Docker credentials
        if: github.event_name != 'pull_request'
        run: |
          echo "Checking Docker credentials..."
          USERNAME="${{ secrets.DOCKER_USERNAME }}"
          PASSWORD="${{ secrets.DOCKER_PASSWORD }}"
          
          if [ -z "$USERNAME" ]; then
            echo "::error::DOCKER_USERNAME is empty or not set"
            exit 1
          fi
          if [ -z "$PASSWORD" ]; then
            echo "::error::DOCKER_PASSWORD is empty or not set"
            exit 1
          fi
          
          echo "DOCKER_USERNAME is set (length: ${#USERNAME} characters)"
          echo "DOCKER_PASSWORD is set (length: ${#PASSWORD} characters)"
          echo "Attempting to login as: $USERNAME"
          
          # Docker Hub username validation (should not contain special characters)
          if [[ ! "$USERNAME" =~ ^[a-z0-9_-]+$ ]]; then
            echo "::warning::DOCKER_USERNAME may contain invalid characters. Docker Hub usernames should be lowercase alphanumeric with hyphens/underscores only."
          fi
          
          # Check if password looks like an access token (starts with dckr_pat_)
          if [[ "$PASSWORD" =~ ^dckr_pat_ ]]; then
            echo "Using Docker Hub Access Token (recommended)"
          else
            echo "::warning::Using password. If 2FA is enabled, you must use an Access Token instead."
          fi
      
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          logout: false
      
      - name: Prepare image tags
        id: tags
        run: |
          IMAGE_NAME="${{ env.IMAGE_NAME }}"
          BRANCH_NAME="${{ github.ref_name }}"
          SHA_SHORT="${{ github.sha }}"
          SHA_SHORT="${SHA_SHORT:0:7}"
          
          TAG1="${IMAGE_NAME}:${BRANCH_NAME}-${SHA_SHORT}"
          TAG2="${IMAGE_NAME}:${BRANCH_NAME}-latest"
          
          TAGS="${TAG1}\n${TAG2}"
          
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            TAGS="${TAGS}\n${IMAGE_NAME}:latest"
          fi
          
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo -e "${TAGS}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./my-react-app/backend
          file: ./my-react-app/backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  deploy-backend:
    name: Deploy Backend
    needs: build-docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment: ${{ github.event.inputs.environment || 'production' }}
    
    defaults:
      run:
        working-directory: ./my-react-app/backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: my-react-app/backend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Configure AWS credentials
        if: env.DEPLOY_TO_AWS == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2
      
      - name: Deploy to AWS Lambda (Serverless)
        if: env.DEPLOY_TO_AWS == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
        run: |
          npm install -g serverless
          serverless deploy --stage ${{ github.event.inputs.environment || 'prod' }}
      
      - name: Deploy notification
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Backend deployment ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment: ${{ github.event.inputs.environment || 'production' }}
    
    defaults:
      run:
        working-directory: ./my-react-app/frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: my-react-app/frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
      
      - name: Deploy to Vercel
        if: env.DEPLOY_TO_VERCEL == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: my-react-app/frontend/dist
          retention-days: 30

