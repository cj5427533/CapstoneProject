name: Docker Build

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'my-react-app/backend/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'my-react-app/backend/**'
  workflow_dispatch:

jobs:
  build:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./my-react-app/backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./my-react-app/backend
          file: ./my-react-app/backend/Dockerfile
          push: false
          tags: capstone-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Test Docker image
        run: |
          docker run --rm -d --name test-backend -p 3000:3000 capstone-backend:test
          sleep 5
          docker ps | grep test-backend
          docker stop test-backend

