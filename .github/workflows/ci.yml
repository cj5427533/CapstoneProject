name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./my-react-app/backend
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: my-react-app/backend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        env:
          NODE_ENV: test
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://test.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || 'test-key' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'test-jwt-secret-key' }}
          PORT: '3002'
        run: npm test
      
      - name: Upload test coverage
        if: matrix.node-version == '20.x'
        uses: codecov/codecov-action@v4
        with:
          files: ./my-react-app/backend/coverage/coverage-final.json
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./my-react-app/frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: my-react-app/frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Type check
        run: npm run build -- --mode development || npx tsc --noEmit
      
      - name: Build production
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: my-react-app/frontend/dist
          retention-days: 7

  lint-check:
    name: Lint Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: |
            my-react-app/backend/package-lock.json
            my-react-app/frontend/package-lock.json
      
      - name: Install backend dependencies
        working-directory: ./my-react-app/backend
        run: npm ci
      
      - name: Install frontend dependencies
        working-directory: ./my-react-app/frontend
        run: npm ci
      
      - name: Check backend package.json
        working-directory: ./my-react-app/backend
        run: npm audit --audit-level=moderate || true
      
      - name: Check frontend package.json
        working-directory: ./my-react-app/frontend
        run: npm audit --audit-level=moderate || true

